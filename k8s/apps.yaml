---
# ==========================================
# 4. THE DATA PROCESSOR (The Brain)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      containers:
      - name: processor
        image: vivek22v/ecommerce-processor:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: ecommerce-secrets
                key: AWS_ACCESS_KEY
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: ecommerce-secrets
                key: AWS_SECRET_KEY