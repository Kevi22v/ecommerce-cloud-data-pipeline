
# ==========================================
# 2. THE ORDER CONVERTER (The Math Engine)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-generator
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: order-generator
  template:
    metadata:
      labels:
        app: order-generator
      annotations:                     
        prometheus.io/scrape: "true"   
        prometheus.io/port: "5000" 
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        workload: spot
      tolerations:
      - key: workload
        operator: Equal
        value: spot
        effect: NoSchedule
      containers:
      - name: generator
        image: vivek22v/ecommerce-generator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        command: ["python", "order_gen.py"]
        envFrom:
        - configMapRef:
            name: ecommerce-config
        readinessProbe:
          exec:
            command: ["sh", "-c", "kill -0 1"]
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          exec:
            command: ["sh", "-c", "kill -0 1"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:            
            cpu: "500m"      
            memory: "512Mi"  

---
