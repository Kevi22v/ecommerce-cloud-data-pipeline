# ==========================================
# 1. THE ORDER GENERATOR (Financials)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-generator
  template:
    metadata:
      labels:
        app: order-generator
    spec:
      containers:
      - name: generator
        image: vivek22v/ecommerce-generator:latest
        imagePullPolicy: Always
        # This tells this specific pod to run the Order script
        command: ["python", "order_gen.py"]
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
        - name: KAFKA_ORDER_TOPIC
          value: "ecommerce_orders"

---
# ==========================================
# 2. THE CLICKSTREAM GENERATOR (Web Traffic)
