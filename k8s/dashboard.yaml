# 1. The Dashboard Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: vivek22v/ecommerce-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000 # Standard Flask port
        # Inject the database credentials
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: DB_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  type: LoadBalancer
  selector:
    app: dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000